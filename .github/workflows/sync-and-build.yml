name: Sync Upstream & Build Client (AMD64)

on:
  schedule:
    # Автоматическая проверка обновлений каждый день в 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/sync-and-build.yml'

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: TrustTunnel/TrustTunnelClient
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest Linux x86_64 console binary
        run: |
          mkdir -p dist
          URL=$(curl -s https://api.github.com/repos/TrustTunnel/TrustTunnelClient/releases/latest \
            | grep "browser_download_url" \
            | grep -E "linux.*(x86_64|amd64)" \
            | head -n 1 \
            | cut -d '"' -f 4)
          echo "Downloading: $URL"
          curl -fL "$URL" -o dist/client.tar.gz
          tar -xzf dist/client.tar.gz -C dist/
          rm -f dist/client.tar.gz
          find dist -type f -executable -exec mv {} dist/trusttunnel_client \;

      - name: Create Dockerfile
        run: |
          cat << 'EOF' > dist/Dockerfile
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY trusttunnel_client /usr/local/bin/trusttunnel_client
          RUN chmod +x /usr/local/bin/trusttunnel_client
          ENTRYPOINT ["/usr/local/bin/trusttunnel_client"]
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: ./dist
          file: ./dist/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trusttunnel-client:latest
            ghcr.io/${{ github.repository_owner }}/trusttunnel-client:${{ github.sha }}
