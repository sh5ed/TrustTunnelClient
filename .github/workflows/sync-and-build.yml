name: Sync Upstream & Build Client (AMD64)

on:
  schedule:
    # Проверка обновлений каждый день в 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/sync-and-build.yml'

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: TrustTunnel/TrustTunnelClient
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip pkg-config libssl-dev
          pip3 install conan

      - name: Build console client
        run: |
          chmod +x integration-tests/build_client.sh
          ./integration-tests/build_client.sh

      - name: Prepare Docker build context
        run: |
          mkdir -p docker-dist
          find build -maxdepth 3 -type f -executable -name "*trusttunnel*" -exec cp {} docker-dist/trusttunnel_client \;
          cat << 'EOF' > docker-dist/Dockerfile
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY trusttunnel_client /usr/local/bin/trusttunnel_client
          RUN chmod +x /usr/local/bin/trusttunnel_client
          ENTRYPOINT ["/usr/local/bin/trusttunnel_client"]
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-dist
          file: ./docker-dist/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trusttunnel-client:latest
            ghcr.io/${{ github.repository_owner }}/trusttunnel-client:${{ github.sha }}
